name: AgentQuant 24/7 Automated Daily Trader

on:
  schedule:
    # 1. Market Open Scan: 13:35 UTC (2:35 PM West Africa Time / 9:35 AM New York Time)
    - cron: '35 13 * * 1-5'
    # 2. Market Close Scan: 19:45 UTC (8:45 PM West Africa Time / 3:45 PM New York Time)
    - cron: '45 19 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (execute or dry-run)'
        required: true
        default: 'execute'
        type: choice
        options:
          - execute
          - dry-run

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels yfinance python-dotenv requests

      - name: Run Daily Signal Scanner & Execution Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          EXEC_MODE: ${{ inputs.mode || 'execute' }}
        run: |
          if [ "$EXEC_MODE" = "dry-run" ]; then
            python scripts/daily_signal_scanner.py --dry-run --notify
          else
            python scripts/daily_signal_scanner.py --execute --notify
          fi
