name: TradingAgents 24/7 Multi-Agent Trader

on:
  schedule:
    # Runs every 15 minutes, 24/7 (Gold & Bitcoin prioritized first, then Forex Majors)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Target symbol (FAST_MAJORS, FAST, ALL, XAUUSD, BTCUSD)'
        required: true
        default: 'FAST_MAJORS'
        type: choice
        options:
          - FAST_MAJORS
          - FAST
          - ALL
          - XAUUSD
          - BTCUSD
          - FOREX_MAJORS
      mode:
        description: 'Execution Mode (live or dry-run)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dry-run

jobs:
  run-tradingagents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TauricResearch/TradingAgents.git
          pip install -e .

      - name: Run TradingAgents Cycle
        env:
          PYTHONPATH: .
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'deepseek/deepseek-chat' }}
          TRADINGAGENTS_MODEL: ${{ secrets.TRADINGAGENTS_MODEL || 'deepseek/deepseek-chat' }}
          TRADINGAGENTS_LLM_PROVIDER: openrouter
          TRADINGAGENTS_TICKET1_LOT_SIZE: '0.05'
          TRADINGAGENTS_TICKET2_LOT_SIZE: '0.07'
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_TRADINGAGENTS_ACCOUNT_ID || '5947478' }}
          CTRADER_TRADINGAGENTS_ACCOUNT_ID: ${{ secrets.CTRADER_TRADINGAGENTS_ACCOUNT_ID || '5947478' }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_TRADINGAGENTS_ACCESS_TOKEN || secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_TRADINGAGENTS_ACCESS_TOKEN: ${{ secrets.CTRADER_TRADINGAGENTS_ACCESS_TOKEN || secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_MCP_URL: ${{ secrets.CTRADER_MCP_URL || 'https://mcp.ctrader.com/trading/mcp' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXEC_MODE: ${{ inputs.mode || 'live' }}
          TARGET_SYM: ${{ inputs.symbol || 'FAST_MAJORS' }}
        run: |
          if [ "$EXEC_MODE" = "live" ]; then
            python scripts/run_tradingagents_cycle.py --symbol "$TARGET_SYM" --live
          else
            python scripts/run_tradingagents_cycle.py --symbol "$TARGET_SYM" --dry-run
          fi
